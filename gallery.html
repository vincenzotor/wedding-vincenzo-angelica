<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carica Foto e Video - Vincenzo & Angelica</title>
    
    <!-- Meta tag per reindirizzare automaticamente l'utente dopo 0 secondi -->
    <meta http-equiv="refresh" content="0;url=https://web.eventpics.net/el65TFKlidaA">
    
    <style>
        body {
            font-family: 'Lora', serif;
            background-color: #fdfbf7;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d4af37; /* Colore oro elegante */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #d4af37;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Stiamo reindirizzando all'album fotografico del matrimonio...</p>
    <p style="font-size: 0.9rem; color: #666;">Se non vieni reindirizzato automaticamente, <a href="https://web.eventpics.net/el65TFKlidaA">clicca qui</a>.</p>

    <!-- Script JavaScript di sicurezza per il reindirizzamento immediato -->
    <script>
        window.location.href = "https://web.eventpics.net/el65TFKlidaA";
    </script>

</body>
</html>
